# XephyGuard CCC resolver. The generated file adds per-client views and block zones.
server:
    interface: 0.0.0.0
    port: 53
    do-ip6: no
    access-control: 0.0.0.0/0 refuse
    hide-identity: yes
    hide-version: yes
    qname-minimisation: yes
    prefetch: yes
    cache-min-ttl: 30
    # The Firefox DoH canary (use-application-dns.net) is in the always-blocked "doh" list.
    # Chrome/Edge "secure DNS" is disabled by managed browser policy (installers/browser-policies).
    verbosity: 1
    log-queries: no
    include: /var/lib/xephyguard/net/unbound-xephyguard.conf

remote-control:
    control-enable: yes
    control-use-cert: no
    control-interface: 127.0.0.1
