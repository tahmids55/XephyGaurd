<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Squircle Gradient -->
    <linearGradient id="bgSquircleDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- White Shield Face Gradient -->
    <linearGradient id="shieldFaceWhite" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="90%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <!-- Crimson Red Border Gradient -->
    <linearGradient id="redBorderGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4d4d" />
      <stop offset="50%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>

    <!-- Squircle Outer Rim Stroke -->
    <linearGradient id="squircleRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#334155" stop-opacity="0.2" />
    </linearGradient>

    <!-- Glowing Drop Shadow -->
    <filter id="iconRedShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.8" />
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#ef4444" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Squircle App Icon Base -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgSquircleDark)" stroke="url(#squircleRim)" stroke-width="3" />

  <!-- Background Radar / Tech Rings -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1.5">
    <circle cx="256" cy="256" r="80" fill="none" />
    <circle cx="256" cy="256" r="160" fill="none" stroke-dasharray="6 6" />
    <circle cx="256" cy="256" r="215" fill="none" />
    <line x1="256" y1="36" x2="256" y2="476" />
    <line x1="36" y1="256" x2="476" y2="256" />
  </g>

  <!-- Main Shield Emblem (Centered & Scaled) -->
  <g transform="translate(256, 256) scale(2.15) translate(-65, -90)" filter="url(#iconRedShadow)">
    
    <!-- Outer Shield Frame (Dark Metal Rim) -->
    <path d="M 65 6 
             L 122 30 
             C 122 98 100 152 65 178 
             C 30 152 8 98 8 30 
             Z" 
          fill="#1e293b" 
          stroke="url(#redBorderGlow)" 
          stroke-width="3" />

    <!-- 1. SHIELD AREA BACKGROUND: PURE WHITE -->
    <path d="M 65 12 
             L 115 34 
             C 115 95 95 145 65 170 
             C 35 145 15 95 15 34 
             Z" 
          fill="url(#shieldFaceWhite)" 
          stroke="#cbd5e1" 
          stroke-width="1.5" />

    <!-- 2. THE 'X': SOLID BLACK WITH CRISP RED BORDER -->
    <!-- Left Blade of 'X' -->
    <path d="M 32 44 
             L 54 44 
             L 74 85 
             L 50 135 
             L 28 135 
             L 48 90 
             Z" 
          fill="#090d16" 
          stroke="url(#redBorderGlow)" 
          stroke-width="3.5" 
          stroke-linejoin="round" />

    <!-- Right Blade of 'X' -->
    <path d="M 98 44 
             L 76 44 
             L 56 85 
             L 80 135 
             L 102 135 
             L 82 90 
             Z" 
          fill="#090d16" 
          stroke="url(#redBorderGlow)" 
          stroke-width="3.5" 
          stroke-linejoin="round" />

    <!-- Center Intersecting Diamond Core -->
    <polygon points="65,65 79,88 65,111 51,88" 
             fill="#090d16" 
             stroke="url(#redBorderGlow)" 
             stroke-width="2.5" 
             stroke-linejoin="round" />
    
    <!-- Center Red Core & White Pulse -->
    <circle cx="65" cy="88" r="4.5" fill="#ef4444" />
    <circle cx="65" cy="88" r="2" fill="#ffffff" />

    <!-- Bottom Shield Anchor Notch -->
    <polygon points="65,148 72,135 58,135" fill="url(#redBorderGlow)" />
  </g>
</svg>
