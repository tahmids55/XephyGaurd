<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <defs>
    <!-- Deep Canvas Background -->
    <linearGradient id="canvasBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- White Shield Gradient & Subtle Depth -->
    <linearGradient id="shieldWhiteGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="90%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <!-- Crimson Red Border Gradient -->
    <linearGradient id="redBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4d4d" />
      <stop offset="50%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>

    <!-- Red Glow Filter -->
    <filter id="redGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#ef4444" flood-opacity="0.5" />
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <!-- Shield Drop Shadow -->
    <filter id="shieldShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000000" flood-opacity="0.8" />
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#ef4444" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="240" rx="16" fill="url(#canvasBg)" />

  <!-- Subtle Blueprint Tech Lines in Background -->
  <g opacity="0.07" stroke="#ffffff" stroke-width="1">
    <line x1="40" y1="0" x2="40" y2="240" />
    <line x1="120" y1="0" x2="120" y2="240" />
    <line x1="200" y1="0" x2="200" y2="240" />
    <line x1="0" y1="60" x2="800" y2="60" />
    <line x1="0" y1="120" x2="800" y2="120" />
    <line x1="0" y1="180" x2="800" y2="180" />
    <circle cx="110" cy="120" r="85" fill="none" stroke-dasharray="4 4" />
  </g>

  <!-- SHIELD EMBLEM (Center X: 110, Y: 120) -->
  <g transform="translate(45, 30)" filter="url(#shieldShadow)">
    
    <!-- Outer Shield Defense Rim (Dark Metal / Red Accent) -->
    <path d="M 65 6 
             L 122 30 
             C 122 98 100 152 65 178 
             C 30 152 8 98 8 30 
             Z" 
          fill="#1e293b" 
          stroke="url(#redBorderGrad)" 
          stroke-width="3" />

    <!-- 1. SHIELD AREA BACKGROUND: PURE WHITE -->
    <path d="M 65 12 
             L 115 34 
             C 115 95 95 145 65 170 
             C 35 145 15 95 15 34 
             Z" 
          fill="url(#shieldWhiteGrad)" 
          stroke="#cbd5e1" 
          stroke-width="1.5" />

    <!-- Inner Subtle White Bevel Glow -->
    <path d="M 65 16 
             L 110 36 
             C 110 92 92 138 65 162 
             C 38 138 20 92 20 36 
             Z" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="2" 
          opacity="0.8" />

    <!-- 2. THE 'X': SOLID BLACK WITH CRISP RED BORDER -->
    <!-- Left Blade of 'X' -->
    <path d="M 32 44 
             L 54 44 
             L 74 85 
             L 50 135 
             L 28 135 
             L 48 90 
             Z" 
          fill="#090d16" 
          stroke="url(#redBorderGrad)" 
          stroke-width="3.5" 
          stroke-linejoin="round" />

    <!-- Right Blade of 'X' -->
    <path d="M 98 44 
             L 76 44 
             L 56 85 
             L 80 135 
             L 102 135 
             L 82 90 
             Z" 
          fill="#090d16" 
          stroke="url(#redBorderGrad)" 
          stroke-width="3.5" 
          stroke-linejoin="round" />

    <!-- Center Intersecting Diamond Core: Black with Red Center Dot -->
    <polygon points="65,65 79,88 65,111 51,88" 
             fill="#090d16" 
             stroke="url(#redBorderGrad)" 
             stroke-width="2.5" 
             stroke-linejoin="round" />
    
    <!-- Glowing Red Core Pulse -->
    <circle cx="65" cy="88" r="4.5" fill="#ef4444" />
    <circle cx="65" cy="88" r="2" fill="#ffffff" />
    
    <!-- Bottom Shield Anchor Notch -->
    <polygon points="65,148 72,135 58,135" fill="url(#redBorderGrad)" />
  </g>

  <!-- BRAND TYPOGRAPHY -->
  <g transform="translate(205, 115)">
    <!-- Main Logotype: XephyGuard -->
    <text font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="58" font-weight="900" letter-spacing="-1.5">
      <tspan fill="#ffffff">Xephy</tspan>
      <tspan fill="url(#redBorderGrad)">Guard</tspan>
    </text>

    <!-- Subtitle / Tagline -->
    <text y="42" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="13" font-weight="700" letter-spacing="4.5" fill="#94a3b8">
      ACADEMIC INTEGRITY &amp; LAB SHIELD
    </text>

    <!-- Security Badges -->
    <g transform="translate(0, 62)">
      <rect x="0" y="0" width="108" height="22" rx="11" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <circle cx="12" cy="11" r="3.5" fill="#ef4444" />
      <text x="23" y="15" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#f1f5f9" letter-spacing="0.5">GATEWAY SEC</text>

      <rect x="116" y="0" width="100" height="22" rx="11" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <circle cx="128" cy="11" r="3.5" fill="#ef4444" />
      <text x="139" y="15" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#f1f5f9" letter-spacing="0.5">ANTI-TAMPER</text>

      <rect x="224" y="0" width="94" height="22" rx="11" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <circle cx="236" cy="11" r="3.5" fill="#10b981" />
      <text x="247" y="15" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#f1f5f9" letter-spacing="0.5">AI-BLOCKED</text>
    </g>
  </g>
</svg>
