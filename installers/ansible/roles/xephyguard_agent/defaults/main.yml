xephyguard_ccc: ""                   # required: CCC server IP or hostname (set in inventory/group_vars)
xephyguard_enroll_key: ""            # from the dashboard "Add a PC" page (vault it)
xephyguard_ca_fingerprint: ""        # SHA-256 hex, from the same page
xephyguard_package_url: "http://{{ xephyguard_ccc }}/downloads/xephyguard-agent_latest_amd64.deb"
xephyguard_harden: true              # root-owned VS Code extensions dir, no sudo for lab users, etc.
xephyguard_lab_group: "students"
