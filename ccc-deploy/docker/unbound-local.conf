# Local proxy_only Unbound resolver template: binds LAN IP (${XG_CCC_IP}) + 127.0.0.1
# so host loopback DNS listeners do not collide. Rendered dynamically by netpolicy-run.sh.
server:
__INTERFACE_LINES__
    port: 53
    do-ip6: no
    access-control: 0.0.0.0/0 refuse
    hide-identity: yes
    hide-version: yes
    qname-minimisation: yes
    prefetch: yes
    cache-min-ttl: 30
    verbosity: 1
    log-queries: no
    include: /var/lib/xephyguard/net/unbound-xephyguard.conf

remote-control:
    control-enable: yes
    control-use-cert: no
    control-interface: 127.0.0.1
