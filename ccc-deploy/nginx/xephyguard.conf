# XephyGuard CCC front door (nginx inside the "web" container, host network).
#   :80    plain HTTP — only the CA certificate, agent installers and the student notice
#   :443   dashboard (TLS, lab CA server certificate) + Reverb WebSocket for browsers
#   :8443  agent endpoint: TLS 1.3, client certificates verified against the lab CA (mTLS)
#   127.0.0.1:8000  internal API for CCC services (proxy event shipping); never on the LAN
# Client-supplied X-SSL-* headers are always overwritten, so they cannot be spoofed.

map $http_upgrade $connection_upgrade { default upgrade; '' close; }
limit_req_zone $binary_remote_addr zone=agents:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=2r/s;

ssl_certificate     /var/lib/xephyguard/ca/server.crt;
ssl_certificate_key /var/lib/xephyguard/ca/server.key;
ssl_session_cache   shared:SSL:10m;
server_tokens off;
client_max_body_size 8m;

upstream php    { server unix:/run/php-fpm.sock; }
upstream reverb { server 127.0.0.1:8081; }

server {
    listen 80 default_server;
    root /var/www/html/public;
    location = /ca.crt          { include /etc/nginx/xg-php.conf; }
    location ^~ /install/       { include /etc/nginx/xg-php.conf; }
    location ^~ /downloads/     { include /etc/nginx/xg-php.conf; }
    location = /notice          { include /etc/nginx/xg-php.conf; }
    location ^~ /build/         { try_files $uri =404; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2 default_server;   # (form accepted by nginx 1.22 in the image and newer)
    ssl_protocols TLSv1.2 TLSv1.3;
    root /var/www/html/public;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' wss: ws:; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-eval'" always;

    location ^~ /api/screen/ { include /etc/nginx/xg-php.conf; } # dashboard screen-view tokens (web auth + CSRF)
    location ^~ /api/ { return 404; }            # agent + internal APIs are not served on the dashboard port
    location ^~ /build/ { expires 30d; try_files $uri =404; }
    location ^~ /app/ {                           # Reverb (Pusher protocol) for dashboard browsers
        proxy_pass http://reverb;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }
    location ^~ /screen-gw/ {                     # Screen viewer WebSocket relay (xephyguard-screen/gateway)
        proxy_pass http://127.0.0.1:8082/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
    location = /login { limit_req zone=login burst=10 nodelay; include /etc/nginx/xg-php.conf; }
    location / { try_files $uri @php; }
    location @php { include /etc/nginx/xg-php.conf; }
}

server {
    listen 8443 ssl;
    ssl_protocols TLSv1.3;
    ssl_client_certificate /var/lib/xephyguard/ca/ca.crt;
    ssl_verify_client optional;                  # enrollment happens before the agent has a certificate
    ssl_verify_depth 1;
    root /var/www/html/public;

    location ^~ /api/agent/v1/enroll {           # token-less, rate limited, key-protected
        limit_req zone=agents burst=20 nodelay;
        include /etc/nginx/xg-php.conf;
    }
    location ^~ /api/agent/v1/ {
        if ($ssl_client_verify != SUCCESS) { return 403; }
        limit_req zone=agents burst=40 nodelay;
        include /etc/nginx/xg-php.conf;
    }
    location ^~ /app/ {                          # Reverb channel for agent commands (mTLS required)
        if ($ssl_client_verify != SUCCESS) { return 403; }
        proxy_pass http://reverb;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 180s;
    }
    location / { return 404; }
}

server {
    listen 127.0.0.1:8000;
    root /var/www/html/public;
    location ^~ /api/internal/ { include /etc/nginx/xg-php.conf; }
    location / { return 404; }
}
