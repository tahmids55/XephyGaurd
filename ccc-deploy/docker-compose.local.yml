# Workspace-local proxy_only stack: uses Docker named volumes (no /var/lib/xephyguard writes, no sudo)
# and renders Unbound listener config from XG_CCC_IP + 127.0.0.1.
name: xephyguard-local

x-app: &app
  image: xephyguard/ccc-app:local
  build: { context: .., dockerfile: ccc-deploy/docker/app.Dockerfile, network: host }
  network_mode: host
  env_file: .env.local
  restart: unless-stopped
  volumes:
    - xg_local_ca:/var/lib/xephyguard/ca
    - xg_local_net:/var/lib/xephyguard/net
    - xg_local_storage:/var/www/html/storage/app
    - xg_local_logs:/var/www/html/storage/logs
  depends_on:
    mysql: { condition: service_healthy }

services:
  mysql:
    image: mysql:8.4
    network_mode: host
    restart: unless-stopped
    command: ["--bind-address=127.0.0.1", "--port=3306", "--mysqlx=OFF", "--innodb-buffer-pool-size=512M", "--default-time-zone=${DB_TIMEZONE:-+00:00}"]
    environment:
      TZ: ${APP_TIMEZONE:-UTC}
      MYSQL_DATABASE: xephyguard
      MYSQL_USER: xephyguard
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - xg_local_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      retries: 30

  web:
    <<: *app
    command: ["web"]
    volumes:
      - xg_local_ca:/var/lib/xephyguard/ca
      - xg_local_net:/var/lib/xephyguard/net
      - xg_local_storage:/var/www/html/storage/app
      - xg_local_logs:/var/www/html/storage/logs
      - ./nginx/xephyguard.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/xg-php.conf:/etc/nginx/xg-php.conf:ro

  reverb:
    <<: *app
    command: ["reverb"]

  worker:
    <<: *app
    command: ["worker"]

  scheduler:
    <<: *app
    command: ["scheduler"]

  netpolicy:
    image: xephyguard/ccc-netpolicy:local
    build: { context: .., dockerfile: ccc-deploy/docker/netpolicy.Dockerfile, network: host }
    network_mode: host
    cap_add: [NET_ADMIN]
    restart: unless-stopped
    env_file: .env.local
    volumes:
      - xg_local_net:/var/lib/xephyguard/net
      - ./docker/unbound-local.conf:/etc/unbound/unbound-local.conf.tmpl:ro

  proxy:
    image: xephyguard/ccc-proxy:local
    build: { context: .., dockerfile: ccc-deploy/docker/proxy.Dockerfile, network: host }
    network_mode: host
    restart: unless-stopped
    volumes:
      - xg_local_net:/var/lib/xephyguard/net:ro
      - xg_local_mitmproxy:/home/mitmproxy/.mitmproxy
      - xg_local_proxy_logs:/var/log/xephyguard

  analysis:
    image: xephyguard/ccc-analysis:local
    build: { context: .., dockerfile: ccc-deploy/docker/analysis.Dockerfile, network: host }
    network_mode: host
    restart: unless-stopped
    environment:
      XG_DB_URL: mysql://xephyguard:${DB_PASSWORD}@127.0.0.1:3306/xephyguard
      XG_INTERNAL_TOKEN: ${XG_INTERNAL_TOKEN}
      XG_SCORING_V2: ${XG_SCORING_V2:-0}
    depends_on:
      mysql: { condition: service_healthy }

  discovery:
    image: xephyguard/ccc-discovery:local
    build: { context: .., dockerfile: ccc-deploy/docker/discovery.Dockerfile, network: host }
    network_mode: host
    restart: unless-stopped
    env_file: .env.local
    volumes:
      - xg_local_ca:/var/lib/xephyguard/ca:ro

  screen-gateway:
    image: xephyguard/ccc-screen-gateway:local
    build: { context: .., dockerfile: ccc-deploy/docker/screen-gateway.Dockerfile, network: host }
    network_mode: host
    restart: unless-stopped
    env_file: .env.local

volumes:
  xg_local_mysql:
  xg_local_ca:
  xg_local_net:
  xg_local_storage:
  xg_local_mitmproxy:
  xg_local_logs:
  xg_local_proxy_logs:
